<style>
:root{

  --radio:6px; --radio-b:999px; --shadow:0 4px 16px -4px rgba(93,82,75,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--crema);color:var(--texto);font-family:var(--ui);font-size:15px;line-height:1.65;
  letter-spacing:-.018em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:980px;margin:0 auto;padding:0 24px}
.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);background:rgba(247,241,227,.88);border-bottom:1px solid var(--borde)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:var(--tinta)}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--tinta);color:var(--crema);display:grid;place-items:center;font-size:15px}
.nav-links{display:flex;gap:20px;font-size:13px;color:var(--apagado)}
.nav-links a:hover{color:var(--tinta)}
.nav-right{display:flex;align-items:center;gap:10px}
.langsel{font-family:var(--ui);font-size:12.5px;color:var(--fuerte);background:var(--papel);border:1px solid var(--borde-s);border-radius:99px;padding:6px 10px;cursor:pointer}
.badge-play{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:var(--radio-b);background:var(--bronce);color:var(--papel);font-size:12px;font-weight:500;white-space:nowrap}
@media(max-width:820px){.nav-links{display:none}}
@media(max-width:560px){.badge-play{display:none}}
.hero{padding:80px 0 60px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:var(--radio);background:var(--papel);
  border:1px solid var(--borde);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--apagado);margin-bottom:26px}
.eyebrow .pulse{width:6px;height:6px;border-radius:50%;background:var(--bien);box-shadow:0 0 8px var(--bien);animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,6.5vw,4.2rem);color:var(--tinta);
  letter-spacing:-.035em;line-height:1.05;margin-bottom:18px;text-wrap:balance}
.hero h1 .accent{color:var(--bronce)}
.hero .lead{max-width:60ch;margin:0 auto 32px;font-family:var(--prosa);font-size:clamp(1.02rem,1.9vw,1.18rem);color:var(--apagado);line-height:1.6}
.hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--radio-b);font-family:var(--ui);
  font-weight:500;font-size:13px;border:1px solid transparent;cursor:pointer;transition:.2s}
.btn-primary{background:var(--tinta);color:var(--crema)}
.btn-primary:hover{background:var(--fuerte);transform:translateY(-1px)}
.btn-marca{background:var(--bronce);color:var(--papel)}
.btn-marca:hover{background:var(--bronce-hover);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--fuerte);border-color:var(--borde-s)}
.btn-ghost:hover{background:var(--papel)}
.phone-frame{max-width:280px;margin:0 auto 30px;aspect-ratio:9/18;border-radius:34px;background:var(--tinta);
  padding:10px;box-shadow:0 30px 60px -20px rgba(36,31,27,.4),0 0 0 1px var(--borde-s)}
.phone-screen{width:100%;height:100%;border-radius:26px;background:var(--hundido);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;text-align:center;position:relative;overflow:hidden}
.phone-screen::after{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:70px;height:5px;border-radius:99px;background:var(--borde)}
.vault-card{width:132px;background:var(--papel);border:1px solid var(--borde);border-radius:10px;box-shadow:var(--shadow);padding:16px 14px;margin:8px 0;text-align:left}
.vault-card .lock{font-size:24px;margin-bottom:8px}
.vault-card .vt{font-family:var(--prosa);font-size:12px;font-weight:600;color:var(--tinta);margin-bottom:8px}
.thumb-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.thumb{aspect-ratio:1;border-radius:5px;background:var(--hundido);border:1px solid var(--borde)}
.thumb.secure{background:var(--melocoton)}
.aes-chip{display:inline-block;font-family:var(--ui);font-size:8.5px;color:var(--bronce);background:var(--bronce-suave);border:1px solid rgba(140,90,49,.25);padding:3px 8px;border-radius:99px}
.phone-label{font-size:10px;color:var(--apoyo);margin-top:18px;text-transform:uppercase;letter-spacing:.1em}
section{padding:60px 0}
.section-head{margin-bottom:40px}
.section-head .kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bronce);font-weight:500;margin-bottom:8px}
.section-head h2{font-family:var(--display);font-size:clamp(1.8rem,4vw,2.5rem);font-weight:400;color:var(--tinta);letter-spacing:-.03em}
.section-head p{color:var(--apagado);margin-top:8px;font-family:var(--prosa);max-width:56ch}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.feature{background:var(--papel);border:1px solid var(--borde);border-radius:var(--radio);padding:22px;transition:.2s}
.feature:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--borde-s)}
.feature .ico{font-size:24px;margin-bottom:12px;display:block}
.feature h3{font-family:var(--prosa);font-size:15px;font-weight:600;color:var(--tinta);margin-bottom:6px}
.feature p{font-size:13.5px;color:var(--apagado);font-family:var(--prosa)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.step .num{font-family:var(--display);font-size:2.6rem;color:var(--bronce);line-height:1;opacity:.5}
.step h3{font-family:var(--prosa);font-size:15px;font-weight:600;color:var(--tinta);margin:4px 0 6px}
.step p{font-size:13.5px;color:var(--apagado);font-family:var(--prosa)}
.privacy-banner{background:var(--papel);border:1px solid var(--borde);border-radius:12px;padding:28px;text-align:center}
.privacy-banner .ico{font-size:28px;margin-bottom:10px}
.privacy-banner h3{font-family:var(--display);font-size:1.5rem;color:var(--tinta);margin-bottom:8px}
.privacy-banner p{color:var(--apagado);font-family:var(--prosa);max-width:58ch;margin:0 auto 16px}
.legal-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.pricing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;max-width:760px;margin:0 auto}
.price-card{background:var(--papel);border:1px solid var(--borde);border-radius:12px;padding:28px 24px;position:relative;transition:.2s;display:flex;flex-direction:column}
.price-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.price-card.featured{border-color:var(--bronce);border-width:1.5px;background:linear-gradient(180deg,var(--bronce-suave),var(--papel))}
.price-tag{position:absolute;top:-11px;right:20px;background:var(--bronce);color:var(--papel);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border-radius:99px}
.price-name{font-family:var(--display);font-size:1.5rem;color:var(--tinta);margin-bottom:6px;font-weight:400}
.price-amt{font-family:var(--display);font-size:2.6rem;color:var(--bronce);line-height:1;margin-bottom:4px}
.price-amt small{font-size:1rem;color:var(--apoyo);font-family:var(--ui)}
.price-amt.free{color:var(--bien)}
.price-sub{font-size:12px;color:var(--apoyo);font-family:var(--ui);margin-bottom:18px}
.price-feats{list-style:none;display:flex;flex-direction:column;gap:9px;margin-bottom:22px;flex:1}
.price-feats li{font-size:13.5px;color:var(--texto);font-family:var(--prosa);padding-left:24px;position:relative}
.price-feats li::before{content:"✓";position:absolute;left:0;color:var(--bronce);font-weight:700}
.price-feats li.no::before{content:"—";color:var(--apoyo);font-weight:400}
.btn-block{display:flex;justify-content:center}
.faq{display:flex;flex-direction:column;gap:10px;max-width:720px;margin:0 auto}
.q{background:var(--papel);border:1px solid var(--borde);border-radius:var(--radio);overflow:hidden}
.q summary{padding:15px 18px;cursor:pointer;font-size:14px;font-weight:500;color:var(--tinta);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.q summary::-webkit-details-marker{display:none}
.q summary::after{content:"+";color:var(--bronce);font-size:18px;font-weight:600;flex:none}
.q[open] summary::after{content:"–"}
.q .a{padding:0 18px 16px;font-size:13.5px;color:var(--apagado);font-family:var(--prosa)}
.q .a a{color:var(--bronce);text-decoration:underline}
.cta{text-align:center;padding:70px 0}
.cta h2{font-family:var(--display);font-size:clamp(2rem,5vw,2.8rem);font-weight:400;color:var(--tinta);margin-bottom:14px}
.cta .accent{color:var(--bronce)}
.cta p{color:var(--apagado);max-width:48ch;margin:0 auto 28px;font-family:var(--prosa)}
footer{border-top:1px solid var(--borde);padding:28px 0;text-align:center;color:var(--apoyo);font-size:12.5px}
footer a{color:var(--apagado)}
footer .links{display:flex;gap:18px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.lang-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.lang-chip{font-family:var(--ui);font-size:11.5px;color:var(--apagado);background:var(--papel);border:1px solid var(--borde);border-radius:99px;padding:5px 12px;cursor:pointer;transition:.15s}
.lang-chip:hover{border-color:var(--bronce);color:var(--tinta)}
.lang-chip.on{background:var(--bronce-suave);border-color:var(--bronce);color:var(--bronce);font-weight:600}
@media(max-width:680px){.hero{padding:56px 0 44px}}

lead:"SafeVault scans your gallery and camera with artificial intelligence that runs inside your phone, detects sensitive images and stores them in an AES-256 encrypted vault. No cloud, no accounts, no ads: nothing leaves your device.",

fs_k:"Features",fs_h2:"All the analysis, on your phone",fs_sub:"Several AI models vote and a consensus router decides. Without consensus, the image goes to review — never a silent action.",
feats:[
["🛡️","Automatic protection","A guardian watches new photos and protects sensitive ones within seconds. Automatic mode straight to the vault, or a manual review queue so you decide."],
["🧠","100% on-device AI","Several models vote (circuit consensus): fewer false positives. No image is ever uploaded to any server. Works offline."],
["🔐","Real encryption","AES-256-GCM with a random per-file key, sealed with RSA-3072. Unlock with fingerprint, screen lock or password. Forget your password and nobody can recover the contents — not even us."],
["📷","AI camera","Real-time classification while you frame the shot. Evidence mode for journalists and experts: the photo goes straight to the vault with date, GPS and a SHA-256 integrity hash."],
["🗂️","Named vaults","Organize like albums: “Personal”, “Work”, “Evidence”… Encrypted backups (.svbk) you can carry to another phone."],
["📤","Share with control","Share one or many photos to any app, with an optional date/GPS footer. Move to the vault or delete several photos at once."]],
how_k:"How it works",how_h2:"Ready in three steps",
steps:[["Pick language & permissions","Español, English, Português, Français, Русский, 中文, 日本語 or 한국어. Grant access to photos and notifications."],
["Download the models","Once only (≈ 22 MB): the app picks the right model for your phone and verifies every file with SHA-256."],
["Create your vault","With your own password. Scan the gallery or let the guardian watch new photos."]],

pv_h3:"Nothing leaves your phone",pv_p:"SafeVault collects nothing, stores nothing on servers and shares no personal data. All analysis, encryption and storage happen exclusively inside your phone.",
pv_b1:"Privacy Policy →",pv_b2:"Terms of Use",
faq_k:"Frequently asked questions",faq_h2:"What you want to know",
faqs:[["Does it work offline?","Internet is used only once, to download the AI models. After that everything is local — check it in airplane mode."],
["What if I forget my password?","Nobody can recover the contents, not even us: the key is generated on your device and never leaves it. Export .svbk backups so you don't lose everything."],
["Can the AI be wrong?","Yes: it's a statistical model. That's why there's a review queue when the circuits disagree, and everything is reversible from the vault."],
["How much does it cost?","The download is free and includes one vault and one imported backup. The one-time “SafeVault Unlimited” purchase ($7.99 USD) unlocks unlimited vaults and backups."],
["When will it be on Google Play?","It's under review. In the meantime, you can explore all the features here."]],

(function(){
  var LANGS=[["es","Español"],["en","English"],["pt","Português"],["fr","Français"],["ru","Русский"],["zh","中文（简体）"],["ja","日本語"],["ko","한국어"]];
  var NAMES={};LANGS.forEach(function(l){NAMES[l[0]]=l[1]});
  function qs(n){try{return new URLSearchParams(location.search).get(n)}catch(e){return null}}
  var saved=null;try{saved=localStorage.getItem("safevault-lang")}catch(e){}
  var q=qs("lang");var lang=(q&&I18N[q])?q:(saved&&I18N[saved]?saved:"es");
  var sel=document.getElementById("langsel");
  var row=document.getElementById("langRow");
  LANGS.forEach(function(l){
    var c=document.createElement("button");c.className="lang-chip";c.textContent=l[1];c.dataset.l=l[0];
    c.onclick=function(){setLang(l[0])};row.appendChild(c);
  });
  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
  function render(l){
    var d=I18N[l];if(!d)return;
    document.documentElement.lang=(l==="zh"?"zh-Hans":l);
    document.querySelectorAll("[data-i]").forEach(function(el){
      var k=el.dataset.i;if(d[k]!=null)el.innerHTML=d[k];
    });
    var fg=document.getElementById("featGrid");fg.innerHTML="";
    d.feats.forEach(function(f){
      var div=document.createElement("div");div.className="feature";
      div.innerHTML='<span class="ico">'+f[0]+'</span><h3>'+f[1]+'</h3><p>'+f[2]+'</p>';fg.appendChild(div);
    });
    var sg=document.getElementById("stepsGrid");sg.innerHTML="";
    d.steps.forEach(function(s,i){
      var div=document.createElement("div");div.className="step";
      div.innerHTML='<div class="num">'+(i+1)+'</div><h3>'+s[0]+'</h3><p>'+s[1]+'</p>';sg.appendChild(div);
    });
    function featsUL(id,arr,noArr){
      var ul=document.getElementById(id);ul.innerHTML="";
      arr.forEach(function(t){var li=document.createElement("li");li.innerHTML=t;ul.appendChild(li)});
      (noArr||[]).forEach(function(t){var li=document.createElement("li");li.className="no";li.innerHTML=t;ul.appendChild(li)});
    }
    featsUL("c1_feats",d.c1_feats,d.c1_feats_no);
    featsUL("c2_feats",d.c2_feats,null);
    var fl=document.getElementById("faqList");fl.innerHTML="";
    d.faqs.forEach(function(f){
      var q=document.createElement("details");q.className="q";
      q.innerHTML='<summary>'+f[0]+'</summary><div class="a">'+f[1]+'</div>';fl.appendChild(q);
    });
    document.querySelectorAll(".lang-chip").forEach(function(c){c.classList.toggle("on",c.dataset.l===l)});
    try{localStorage.setItem("safevault-lang",l)}catch(e){}
    document.title="SafeVault — "+d.h1a+" "+d.h1b;
  }
  function setLang(l){if(!I18N[l])return;sel.value=l;render(l)}
  window.setLang=setLang;
  sel.value=lang;render(lang);
  sel.addEventListener("change",function(){render(sel.value)});
})();
</script>
