# ============================================================================
#  Release del Portafolio
# ----------------------------------------------------------------------------
#  Se dispara al crear un tag vX.Y.Z. Empaqueta el sitio en un .zip,
#  actualiza el CHANGELOG y publica una release de GitHub.
#
#  AUTO-CLEANUP: antes de publicar, elimina TODAS las releases anteriores
#  (con sus tags) para mantener SOLO la ultima version.
# ============================================================================
name: Release Portafolio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publicar (ej. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
            case "$V" in v*) ;; *) V="v$V" ;; esac
          else
            V="${GITHUB_REF_NAME}"
          fi
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "num=${V#v}" >> "$GITHUB_OUTPUT"
          echo "Publicando version: $V"

      - name: Eliminar releases anteriores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="${{ steps.ver.outputs.tag }}"
          echo "Buscando releases previas (excepto $NEW_TAG)..."
          PREV=$(gh release list --limit 100 --json tagName -q '.[].tagName' | grep -v "^${NEW_TAG}$" || true)
          if [ -z "$PREV" ]; then
            echo "No hay releases previas que limpiar."
          else
            for old in $PREV; do
              echo "Eliminando release $old ..."
              gh release delete "$old" --yes --cleanup-tag || echo "no se pudo eliminar $old"
            done
            echo "Cleanup completado."
          fi

      - name: Empaquetar sitio
        run: |
          VERSION="${{ steps.ver.outputs.num }}"
          STAGE="portafolio-${VERSION}"
          zip -r "${STAGE}.zip" src -x "*/.*"
          ls -la "${STAGE}.zip"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NUM: ${{ steps.ver.outputs.num }}
          VERSION_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          {
            echo "## Portafolio v${VERSION_NUM}"
            echo ""
            echo "### Novedades"
            echo "- Sitio web del portafolio version ${VERSION_NUM}"
            echo "- Estilo microsoft.ai / Claude Desktop"
            echo "- Proyectos, skills, trayectoria y contacto"
            echo ""
            echo "**Asset:** portafolio-${VERSION_NUM}.zip"
            echo ""
            echo "Ver en vivo: https://serviciosconiabyjhonsu.com"
          } > /tmp/notes.md
          gh release create "${VERSION_TAG}" \
            --title "Portafolio ${VERSION_TAG}" \
            --notes-file /tmp/notes.md \
            --latest \
            "portafolio-${VERSION_NUM}.zip"

      - name: Verificar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Releases activas ==="
          gh release list
          COUNT=$(gh release list --json tagName -q '. | length')
          echo "Total: $COUNT release(s) activa(s)"
